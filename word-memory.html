<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="单词记忆">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect x='32' y='32' width='448' height='448' rx='100' fill='%231a0f2e'/><path d='M210 130 L350 160 L290 240 L170 210 Z' fill='%23b993ef'/><path d='M210 130 L170 210 L130 280 L160 180 Z' fill='%238d61c9'/><path d='M170 210 L290 240 L250 390 L130 280 Z' fill='%2359358c'/><path d='M290 240 L350 160 L400 300 L250 390 Z' fill='%23351e5e'/><path d='M350 160 L410 220 L400 300 Z' fill='%23492b7c'/></svg>">
<title>单词记忆</title>
<style>
:root {
    color-scheme: dark;
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text2: #a0a0a0;
    --text3: #6b6b6b;
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.12);
    --blue: #60a5fa;
    --blue-bg: rgba(96,165,250,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
    --font-en:"SF Pro Display","Inter",-apple-system,sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 16px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
}
input,textarea{font-family:var(--font);color:var(--text);-webkit-user-select:text;user-select:text}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px;padding-bottom:calc(80px + var(--safe-bottom))}
.page{display:none;flex:1;animation:fadeIn .25s ease}
.page.active{display:block}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

/* nav */
.nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    max-width:480px;width:100%;
    display:flex;justify-content:space-around;align-items:center;
    background:rgba(15,15,15,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    padding:8px 0 var(--safe-bottom);
    z-index:100;
}
.nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--text3);font-size:10px;
    padding:4px 8px;cursor:pointer;transition:color .2s;
    -webkit-tap-highlight-color:transparent;
}
.nav-btn svg{width:18px;height:18px}
.nav-btn.active{color:var(--text)}

/* header */
.header{padding:24px 0 8px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600;letter-spacing:-0.3px}

/* cards */
.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;margin-bottom:12px;
}
.card-sm{padding:14px 16px}

/* stats bar */
.stats-bar{
    display:flex;gap:12px;margin:12px 0 16px;
}
.stat-item{
    flex:1;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;text-align:center;
}
.stat-num{font-size:28px;font-weight:700;letter-spacing:-0.5px;font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--text3);margin-top:4px}
.stat-num.green{color:var(--green)}
.stat-num.blue{color:var(--blue)}

/* buttons */
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 24px;border-radius:var(--radius-sm);border:none;
    font-size:15px;font-weight:500;cursor:pointer;transition:all .15s;
    -webkit-tap-highlight-color:transparent;
    min-height:44px;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#fff;color:#000;width:100%}
.btn-primary:active{background:#e0e0e0}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:active{background:var(--surface2)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:active{background:rgba(248,113,113,0.25)}
.btn-small{padding:8px 16px;font-size:13px;min-height:36px}

/* word card */
.word-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 24px;min-height:320px;position:relative;
}
.word-en{
    font-family:var(--font-en);
    font-size:clamp(28px,8vw,42px);
    font-weight:600;letter-spacing:-0.5px;
    text-align:center;margin:16px 0;
    transition:opacity .3s;
}
.word-zh{
    font-size:18px;color:var(--text2);text-align:center;
    margin:12px 0 24px;min-height:28px;
    animation:slideUp .3s ease;
}
.word-speak{
    position:absolute;top:12px;right:12px;
    width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface2);color:var(--text2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:18px;transition:all .15s;
}
.word-speak:active{background:var(--border);color:var(--text)}
.reveal-area{margin-top:8px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:16px}
.answer-btns{display:flex;gap:12px;width:100%;max-width:280px}
.answer-btn{
    flex:1;padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border);
    font-size:16px;font-weight:500;cursor:pointer;transition:all .15s;
    min-height:52px;display:flex;align-items:center;justify-content:center;
}
.answer-btn:active{transform:scale(0.96)}
.answer-btn.wrong{background:var(--red-bg);color:var(--red);border-color:transparent}
.answer-btn.wrong:active{background:rgba(248,113,113,0.25)}
.answer-btn.correct{background:var(--green-bg);color:var(--green);border-color:transparent}
.answer-btn.correct:active{background:rgba(74,222,128,0.25)}
/* progress dots */
.progress-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:24px;padding:0 8px;max-height:80px;overflow-y:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);transition:all .3s;flex-shrink:0}
.dot.active{width:10px;height:10px;background:var(--text);box-shadow:0 0 8px rgba(255,255,255,0.3);margin-top:-1px}
.dot.correct{background:var(--green);box-shadow:0 0 4px rgba(74,222,128,0.5)}
.dot.wrong{background:var(--red);box-shadow:0 0 4px rgba(248,113,113,0.5)}
/* card animations */
.word-card{transition:box-shadow .3s,transform .2s}
.word-card.flash-green{box-shadow:0 0 40px rgba(74,222,128,0.25),inset 0 0 40px rgba(74,222,128,0.06)}
.word-card.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* streak badge */
.streak-badge{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.streak-fire{font-size:16px;line-height:1}
/* reference word list */
.ref-group{margin-bottom:16px}
.ref-group-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.ref-letter{font-size:16px;font-weight:600;color:var(--text)}
.ref-count{font-size:12px;color:var(--text3)}
.ref-subsection{margin-bottom:8px}
.ref-subtitle{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin:8px 0 4px}
.ref-word{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:13px;border-radius:4px}
.ref-word .ref-en{font-family:var(--font-en);color:var(--text);min-width:100px}
.ref-word .ref-zh{color:var(--text2)}
.ref-word .ref-check{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px}
.ref-word.checked .ref-check{background:var(--green);color:#0f0f0f}
.ref-word.unchecked .ref-check{border:1px solid var(--border)}
.ref-import-area{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:13px;color:var(--text);resize:vertical;line-height:1.6}
.ref-import-area:focus{outline:none;border-color:var(--blue)}

/* countdown */
.countdown-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.countdown-item{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;
    cursor:pointer;transition:border-color .15s;
}
.countdown-item:active{border-color:var(--text3)}
.countdown-days{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:50px;text-align:right}
.countdown-name{font-size:14px;color:var(--text2)}
.countdown-date{font-size:11px;color:var(--text3);margin-top:2px}
.countdown-add{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:14px;border:1px dashed var(--border);border-radius:var(--radius);
    color:var(--text3);font-size:14px;cursor:pointer;transition:all .15s;
}
.countdown-add:active{color:var(--text2);border-color:var(--text2)}

/* wrong list */
.wrong-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border);
}
.wrong-en{font-family:var(--font-en);font-size:16px;font-weight:500}
.wrong-zh{font-size:13px;color:var(--text3);margin-top:2px}
.wrong-count{
    font-size:12px;color:var(--red);background:var(--red-bg);
    padding:3px 10px;border-radius:10px;font-weight:500
}
.wrong-count.zero{color:var(--text3);background:var(--surface2)} /* not used, kept for ref */

/* stats */
.stat-table{width:100%;border-collapse:collapse}
.stat-table th,.stat-table td{padding:10px 12px;text-align:center;font-size:13px}
.stat-table th{color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase}
.stat-table td{border-bottom:1px solid var(--border)}
.stat-table tr:last-child td{border-bottom:none}

/* import */
.import-area{width:100%;min-height:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:14px;color:var(--text);resize:vertical;line-height:1.6}
.import-area:focus{outline:none;border-color:var(--blue)}
.import-preview{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;margin:12px 0;
    max-height:200px;overflow-y:auto;font-size:13px;
}
.import-preview .word-row{display:flex;gap:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.import-preview .w-en{color:var(--text);font-family:var(--font-en);min-width:100px}
.import-preview .w-zh{color:var(--text2)}

/* modal */
.modal-overlay{
    display:none;position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
    align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:24px;width:calc(100% - 48px);
    max-width:400px;animation:scaleIn .2s ease;
}
.modal h2{font-size:17px;font-weight:600;margin-bottom:12px}
.modal p{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.modal .actions{display:flex;flex-direction:column;gap:8px}
.modal input[type="text"],.modal input[type="date"]{
    width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius-sm);font-size:14px;margin-bottom:12px;
}
.modal input:focus{outline:none;border-color:var(--blue)}
.modal .row{display:flex;gap:8px}
.modal .row .btn{flex:1}

/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty svg{margin-bottom:16px;opacity:0.4}
.empty p{font-size:14px;line-height:1.6}

/* misc */
.section-title{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin:20px 0 10px}
.inline-link{color:var(--blue);cursor:pointer;font-size:14px}
.inline-link:active{opacity:0.7}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.text-secondary{color:var(--text2);font-size:14px}
.text-tertiary{color:var(--text3);font-size:12px}
.mt-sm{margin-top:8px}
.mt-md{margin-top:16px}
.mt-lg{margin-top:24px}
.mb-sm{margin-bottom:8px}
.mb-md{margin-bottom:16px}
.gap-sm{display:flex;flex-direction:column;gap:8px}
.gap-md{display:flex;flex-direction:column;gap:12px}
.row-gap{display:flex;gap:8px}
</style>
</head>
<body>

<div id="app" class="app">

<!-- ========== 主页 ========== -->
<div id="page-home" class="page active">
    <div class="header"><h1>单词记忆</h1><span class="streak-badge" id="streak-badge"></span></div>

    <!-- 今日进度 -->
    <div class="stats-bar" id="today-stats">
        <div class="stat-item">
            <div class="stat-num blue" id="stat-tested">0</div>
            <div class="stat-label">今日已测</div>
        </div>
        <div class="stat-item">
            <div class="stat-num green" id="stat-rate">--%</div>
            <div class="stat-label">正确率</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" id="stat-wrong"></div>
            <div class="stat-label">错词数</div>
        </div>
    </div>

    <!-- 倒数日 -->
    <div class="section-title">倒数日</div>
    <div class="countdown-list" id="countdown-list"></div>
    <div class="countdown-add" id="btn-add-countdown">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg>
        添加倒数日
    </div>

    <!-- 操作按钮 -->
    <div class="gap-sm mt-lg">
        <button class="btn btn-primary" id="btn-start-study">开始学习</button>
        <button class="btn btn-ghost" id="btn-wrong-review" style="width:100%">专项复习错词</button>
    </div>
    <div class="text-tertiary mt-sm" style="text-align:center" id="word-count-info"></div>
</div>

<!-- ========== 学习页 ========== -->
<div id="page-study" class="page">
    <div class="header">
        <button class="btn btn-ghost btn-small" id="btn-study-back">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
            返回
        </button>
        <span class="text-secondary" id="study-mode-label">学习</span>
        <span style="width:50px"></span>
    </div>
    <div class="card word-card" id="word-card">
        <button class="word-speak" id="btn-speak" title="朗读">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
            </svg>
        </button>
        <div class="word-en" id="word-en"></div>
        <div class="reveal-area" id="reveal-area">
            <div class="word-zh" id="word-zh" style="visibility:hidden"></div>
            <button class="btn btn-ghost" id="btn-reveal">显示释义</button>
            <div class="answer-btns" id="answer-btns" style="display:none">
                <button class="answer-btn wrong" id="btn-wrong">✗</button>
                <button class="answer-btn correct" id="btn-correct">✓</button>
            </div>
        </div>
        <div class="progress-dots" id="progress-dots"></div>
    </div>
    <p class="text-tertiary" style="text-align:center" id="progress-text"></p>
</div>

<!-- ========== 错词本 ========== -->
<div id="page-wrong" class="page">
    <div class="header"><h1>错词本</h1></div>
    <div id="wrong-list"></div>
    <div id="wrong-empty" class="empty" style="display:none">
        <p>暂无错词<br>继续加油</p>
    </div>
    <button class="btn btn-primary mt-lg" id="btn-wrong-review2" style="display:none">专项复习错词</button>
</div>

<!-- ========== 统计页 ========== -->
<div id="page-stats" class="page">
    <div class="header"><h1>学习统计</h1></div>
    <div class="card card-sm">
        <table class="stat-table">
            <thead><tr><th>日期</th><th>已测</th><th>正确</th><th>正确率</th></tr></thead>
            <tbody id="stats-body"><tr><td colspan="4" class="text-tertiary">暂无记录</td></tr></tbody>
        </table>
    </div>
</div>

<!-- ========== 参考词库页 ========== -->
<div id="page-ref" class="page">
    <div class="header"><h1>参考词库</h1><span class="text-secondary" id="ref-coverage"></span></div>
    <p class="text-secondary mb-sm">母版词库对照表，A 库已收录的会自动勾选。<button class="inline-link" id="btn-ref-import-toggle">导入词库</button></p>
    <div id="ref-import-block" style="display:none">
        <textarea class="ref-import-area" id="ref-import-text" placeholder="粘贴母版词库，每行"英文 中文"（空格分隔）"></textarea>
        <div class="row-gap mt-sm">
            <button class="btn btn-primary btn-small" id="btn-ref-parse" style="flex:1">解析导入</button>
            <button class="btn btn-ghost btn-small" id="btn-ref-replace">替换现有</button>
            <button class="btn btn-ghost btn-small" id="btn-ref-clear">清空</button>
        </div>
    </div>
    <div id="ref-list" class="mt-md"></div>
    <div id="ref-empty" class="empty" style="display:none"><p>尚未导入参考词库</p></div>
</div>

<!-- ========== 导入页 ========== -->
<div id="page-import" class="page">
    <div class="header"><h1>导入单词</h1></div>
    <p class="text-secondary mb-sm">粘贴文本，每行一条"英文 中文"（空格分隔），一行可包含多组。</p>
    <textarea class="import-area" id="import-text" placeholder="例：&#10;reputation 名声 diagram 图表 poet 诗人&#10;navy 海军，深蓝色的"></textarea>
    <div class="row-gap mt-sm">
        <button class="btn btn-primary" id="btn-parse" style="flex:1">解析预览</button>
        <button class="btn btn-ghost btn-small" id="btn-load-demo">加载示例</button>
    </div>
    <div class="import-preview" id="import-preview" style="display:none">
        <div class="flex-between mb-sm">
            <span class="text-secondary" id="import-count"></span>
            <span class="inline-link" id="btn-clear-preview">清除</span>
        </div>
        <div id="import-words"></div>
    </div>
    <button class="btn btn-primary mt-sm" id="btn-import-confirm" style="display:none">确认导入</button>
</div>

<!-- ========== 底部导航 ========== -->
<nav class="nav">
    <button class="nav-btn active" data-page="home">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l7-5 7 5v9a1 1 0 01-1 1H4a1 1 0 01-1-1V8z"/></svg>
        首页
    </button>
    <button class="nav-btn" data-page="study">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="14" height="16" rx="2"/><path d="M8 7h4M8 10h4M8 13h3"/></svg>
        学习
    </button>
    <button class="nav-btn" data-page="wrong">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l10 10M15 5L5 15"/><circle cx="10" cy="10" r="8"/></svg>
        错词本
    </button>
    <button class="nav-btn" data-page="stats">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="12" width="4" height="6" rx="1"/><rect x="8" y="7" width="4" height="11" rx="1"/><rect x="14" y="2" width="4" height="16" rx="1"/></svg>
        统计

// ==================== 状态 ====================
const DEFAULT_STATE = {
    words: BUILTIN_WORDS,
    order: [],
    index: 0,
    wrong: {},
    stats: {},
    countdowns: [],
    lastDate: '',
    streak: 0,
    roundResults: []
};

let state = {};

function loadState(){
    try{
        const raw = localStorage.getItem('vm_state');
        if(raw){
            const saved = JSON.parse(raw);
            // 合并默认值，避免旧版本缺少字段
            state = Object.assign({}, DEFAULT_STATE, saved);
            // 确保 words 至少是空数组
            if(!Array.isArray(state.words)) state.words = [];
            if(!Array.isArray(state.order)) state.order = [];
            if(typeof state.index !== 'number') state.index = 0;
            if(!state.wrong || typeof state.wrong !== 'object') state.wrong = {};
            if(!state.stats || typeof state.stats !== 'object') state.stats = {};
            if(!Array.isArray(state.countdowns)) state.countdowns = [];
            if(typeof state.lastDate !== 'string') state.lastDate = '';
            if(typeof state.streak !== 'number') state.streak = 0;
            if(!Array.isArray(state.roundResults)) state.roundResults = [];
        } else {
            state = JSON.parse(JSON.stringify(DEFAULT_STATE));
            // 首次使用：生成乱序
            state.order = shuffle(state.words.map((_,i)=>i));
            saveState();
        }
    }catch(e){
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        state.order = shuffle(state.words.map((_,i)=>i));
    }
}

function saveState(){
    try{
        localStorage.setItem('vm_state', JSON.stringify(state));
    }catch(e){
        // localStorage 满，尝试清理旧数据
        alert('存储空间不足，请清理浏览器数据');
    }
}

// ==================== 参考词库 (B) ====================
let refWords = [];

function loadRefWords(){
    try{
        const raw = localStorage.getItem('vm_ref_words');
        if(raw) refWords = JSON.parse(raw);
        if(!Array.isArray(refWords)) refWords = [];
    }catch(e){ refWords = []; }
}

function saveRefWords(){
    try{ localStorage.setItem('vm_ref_words', JSON.stringify(refWords)); }
    catch(e){ alert('存储空间不足'); }
}

function syncRefChecked(){
    // 将 A 库中的单词在 B 库中标记为已收录
    const mainSet = new Set(state.words.map(w=>w.en.toLowerCase()));
    let changed = false;
    for(const r of refWords){
        const inMain = mainSet.has(r.en.toLowerCase());
        if(r.inMain !== inMain){ r.inMain = inMain; changed = true; }
    }
    if(changed) saveRefWords();
}

function renderRefPage(){
    loadRefWords();
    syncRefChecked();
    const listEl = document.getElementById('ref-list');
    const emptyEl = document.getElementById('ref-empty');
    const coverageEl = document.getElementById('ref-coverage');

    if(refWords.length===0){
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        coverageEl.textContent = '';
        return;
    }
    emptyEl.style.display = 'none';

    const checked = refWords.filter(r=>r.inMain).length;
    coverageEl.textContent = `已覆盖 ${checked}/${refWords.length}`;

    // 按首字母分组
    const groups = {};
    for(const r of refWords){
        const letter = r.en[0].toUpperCase();
        if(!groups[letter]) groups[letter] = {checked:[],unchecked:[]};
        groups[letter][r.inMain?'checked':'unchecked'].push(r);
    }
    const letters = Object.keys(groups).sort();

    let html = '';
    for(const letter of letters){
        const g = groups[letter];
        const total = g.checked.length + g.unchecked.length;
        html += `<div class="ref-group">
            <div class="ref-group-header"><span class="ref-letter">${letter}</span><span class="ref-count">${g.checked.length}/${total}</span></div>`;
        // 已收录
        if(g.checked.length>0){
            html += `<div class="ref-subsection"><div class="ref-subtitle">已收录 (${g.checked.length})</div>`;
            for(const w of g.checked.sort((a,b)=>a.en.localeCompare(b.en))){
                html += `<div class="ref-word checked"><span class="ref-check">&#10003;</span><span class="ref-en">${esc(w.en)}</span><span class="ref-zh">${esc(w.zh)}</span></div>`;
            }
            html += `</div>`;
        }
        // 未收录
        if(g.unchecked.length>0){
            html += `<div class="ref-subsection"><div class="ref-subtitle">未收录 (${g.unchecked.length})</div>`;
            for(const w of g.unchecked.sort((a,b)=>a.en.localeCompare(b.en))){
                html += `<div class="ref-word unchecked"><span class="ref-check"></span><span class="ref-en">${esc(w.en)}</span><span class="ref-zh">${esc(w.zh)}</span></div>`;
            }
            html += `</div>`;
        }
        html += `</div>`;
    }
    listEl.innerHTML = html;
}

// ==================== 工具函数 ====================
function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

function today(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function daysBetween(d1,d2){
    const a = new Date(d1); const b = new Date(d2);
    return Math.floor((b-a)/(1000*60*60*24));
}

// ==================== 解析文本 ====================
function parseWordText(text){
    // 移除 PDF 页面标记
    text = text.replace(/--\s*\d+\s*of\s*\d+\s*--/g, '');
    // 移除表头行
    const skip = /^(姓名|日期|第.*课|词数|第\d+天|复习|日期\s*\d|遗忘|词数)[：:\s]/;
    const lines = text.split(/[\n\r]+/);
    const cleaned = [];
    for(const line of lines){
        const t = line.trim();
        if(!t) continue;
        if(skip.test(t)) continue;
        if(/^(复习|遗忘|词数)$/.test(t)) continue;
        if(/^[\d\-]+\s+[\d\-]+/.test(t)) continue; // 日期行 05-25 05-26...
        cleaned.push(t);
    }
    const joined = cleaned.join(' ').replace(/\s+/g,' ').trim();
    // 提取 English-Chinese 对：字母单词 + 空格 + 直到下一个字母单词之前的内容
    const re = /([a-zA-Z]+)\s+(.+?)(?=\s+[a-zA-Z]+\s|$)/g;
    const entries = [];
    let m;
    while((m=re.exec(joined))!==null){
        const zh = m[2].trim();
        if(/[一-鿿]/.test(zh)){
            entries.push({en:m[1],zh});
        }
    }
    return entries;
}

// ==================== 语音 ====================
function speakWord(word){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.85;
    // 尝试获取英语语音
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v=>v.lang.startsWith('en'));
    if(enVoice) u.voice = enVoice;
    window.speechSynthesis.speak(u);
}

// ==================== 页面路由 ====================
let currentPage = 'home';

function navigate(page){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const el = document.getElementById('page-'+page);
    if(el) el.classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.page===page);
    });
    currentPage = page;
    if(page==='home') renderHome();
    if(page==='study') renderStudy();
    if(page==='wrong') renderWrongList();
    if(page==='stats') renderStats();
    if(page==='import') renderImport();
    if(page==='ref') renderRefPage();
}

// ==================== 主页渲染 ====================
function renderHome(){
    checkDayReset();
    const td = today();
    const ds = state.stats[td] || {tested:0,correct:0};
    document.getElementById('stat-tested').textContent = ds.tested;
    document.getElementById('stat-rate').textContent = ds.tested>0 ? Math.round(ds.correct/ds.tested*100)+'%' : '--%';
    document.getElementById('stat-wrong').textContent = Object.keys(state.wrong).length;
    // streak badge
    const badge = document.getElementById('streak-badge');
    if(state.streak > 1){
        badge.innerHTML = '<span class="streak-fire">&#9650;</span> 连续 '+state.streak+' 天';
        badge.style.display = '';
    } else {
        badge.style.display = 'none';
    }
    renderCountdowns();
    const total = state.words.length;
    document.getElementById('word-count-info').textContent = total>0 ? `词库共 ${total} 个单词` : '尚未导入单词';
}

function renderCountdowns(){
    const list = document.getElementById('countdown-list');
    const td = today();
    list.innerHTML = state.countdowns.map((cd,i)=>{
        const days = daysBetween(td, cd.date);
        let dsText, dsColor;
        if(days>0){dsText=days+'天';dsColor='var(--blue)';}
        else if(days===0){dsText='今天';dsColor='var(--green)';}
        else{dsText='已过'+(Math.abs(days))+'天';dsColor='var(--text3)';}
        return `<div class="countdown-item" data-cd="${i}">
            <div><div class="countdown-name">${esc(cd.name)}</div><div class="countdown-date">${cd.date}</div></div>
            <div class="countdown-days" style="color:${dsColor}">${dsText}</div>
        </div>`;
    }).join('');
    // 点击编辑
    list.querySelectorAll('.countdown-item').forEach(el=>{
        el.addEventListener('click',()=>editCountdown(parseInt(el.dataset.cd)));
    });
}

function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ==================== 学习渲染 ====================
let studyMode = 'normal'; // 'normal' | 'wrong-review'
let revealed = false;

function getStudyList(){
    if(studyMode==='wrong-review'){
        return Object.values(state.wrong);
    }
    return state.order.map(i=>state.words[i]);
}

function renderStudy(){
    const list = getStudyList();
    const total = list.length;
    const idx = state.index;
    const dotsEl = document.getElementById('progress-dots');
    const card = document.getElementById('word-card');
    card.classList.remove('flash-green','shake');

    if(total===0){
        document.getElementById('word-en').textContent = '没有单词';
        document.getElementById('word-zh').style.visibility = 'hidden';
        document.getElementById('word-zh').textContent = '';
        document.getElementById('btn-reveal').style.display = 'none';
        document.getElementById('answer-btns').style.display = 'none';
        document.getElementById('btn-speak').style.display = 'none';
        dotsEl.innerHTML = '';
        document.getElementById('progress-text').textContent = '';
        document.getElementById('study-mode-label').textContent = studyMode==='wrong-review' ? '错词复习' : '学习';
        return;
    }
    if(idx >= total){
        showCompletion();
        return;
    }
    document.getElementById('btn-speak').style.display = '';
    const word = list[idx];
    revealed = false;
    document.getElementById('word-en').textContent = word.en;
    document.getElementById('word-zh').style.visibility = 'hidden';
    document.getElementById('word-zh').textContent = word.zh;
    document.getElementById('btn-reveal').style.display = '';
    document.getElementById('answer-btns').style.display = 'none';
    document.getElementById('progress-text').textContent = (idx+1)+' / '+total;
    document.getElementById('study-mode-label').textContent = studyMode==='wrong-review' ? '错词复习' : '学习';
    // 渲染圆点指示器
    dotsEl.innerHTML = '';
    for(let i=0;i<total;i++){
        const dot = document.createElement('span');
        dot.className = 'dot';
        if(i<idx){
            dot.classList.add(state.roundResults[i]==='correct'?'correct':'wrong');
        } else if(i===idx){
            dot.classList.add('active');
        }
        dotsEl.appendChild(dot);
    }
}

// ==================== 学习操作 ====================
function revealWord(){
    revealed = true;
    document.getElementById('word-zh').style.visibility = 'visible';
    document.getElementById('btn-reveal').style.display = 'none';
    document.getElementById('answer-btns').style.display = 'flex';
}

function answerWord(correct){
    if(!revealed) return;
    revealed = false; // 防止重复点击
    checkDayReset();
    const td = today();
    if(!state.stats[td]) state.stats[td] = {tested:0,correct:0};
    state.stats[td].tested++;

    // 记录本轮结果
    state.roundResults[state.index] = correct?'correct':'wrong';

    let removed = false;
    if(correct){
        state.stats[td].correct++;
        if(studyMode==='wrong-review'){
            const list = Object.values(state.wrong);
            const word = list[state.index];
            if(word && state.wrong[word.en]){
                state.wrong[word.en].count--;
                if(state.wrong[word.en].count <= 0){
                    delete state.wrong[word.en];
                    removed = true;
                }
            }
        }
    } else {
        const list = getStudyList();
        const word = list[state.index];
        if(word){
            if(!state.wrong[word.en]){
                state.wrong[word.en] = {en:word.en,zh:word.zh,count:0};
            }
            state.wrong[word.en].count++;
        }
    }

    // 动效反馈
    const card = document.getElementById('word-card');
    if(correct){
        card.classList.add('flash-green');
    } else {
        card.classList.add('shake');
        card.addEventListener('animationend', ()=>card.classList.remove('shake'), {once:true});
    }

    // 更新圆点
    const dotsEl = document.getElementById('progress-dots');
    const dots = dotsEl.children;
    if(dots[state.index]){
        dots[state.index].classList.remove('active');
        dots[state.index].classList.add(correct?'correct':'wrong');
    }

    if(!removed) state.index++;
    const updatedList = getStudyList();
    if(state.index >= updatedList.length && studyMode==='wrong-review'){
        if(Object.keys(state.wrong).length > 0){
            state.index = 0;
        }
    }
    saveState();

    if(correct && state.index < updatedList.length){
        // 答对：短暂动画后自动翻下一词
        setTimeout(()=>{
            card.classList.remove('flash-green');
            renderStudy();
            renderHome();
        }, 400);
    } else {
        // 答错 或 已完成：立即切换
        setTimeout(()=>{
            card.classList.remove('flash-green');
            renderStudy();
            renderHome();
        }, 300);
    }
}

// ==================== 完成弹窗 ====================
function showCompletion(){
    const td = today();
    const ds = state.stats[td] || {tested:0,correct:0};
    const roundTotal = state.roundResults.length;
    const roundCorrect = state.roundResults.filter(r=>r==='correct').length;
    const roundRate = roundTotal>0 ? Math.round(roundCorrect/roundTotal*100) : 0;

    document.getElementById('complete-tested').textContent = roundTotal;
    document.getElementById('complete-rate').textContent = roundRate+'%';

    let title,detail;
    if(roundRate>=90){title='太强了';detail='正确率 '+roundRate+'%，保持这个状态！';}
    else if(roundRate>=70){title='表现不错';detail='正确率 '+roundRate+'%，再复习一轮巩固一下？';}
    else{title='继续加油';detail='正确率 '+roundRate+'%，多练练错词会有进步';}
    document.getElementById('complete-title').textContent = title;
    document.getElementById('complete-detail').textContent = detail;

    // 禁用学习页按钮避免误触
    document.getElementById('word-en').textContent = '完成';
    document.getElementById('word-zh').style.visibility = 'hidden';
    document.getElementById('btn-reveal').style.display = 'none';
    document.getElementById('answer-btns').style.display = 'none';
    document.getElementById('btn-speak').style.display = 'none';
    document.getElementById('progress-text').textContent = '';

    document.getElementById('modal-complete').classList.add('show');
}

// ==================== 统计页渲染 ====================
function renderStats(){
    const tbody = document.getElementById('stats-body');
    const dates = Object.keys(state.stats).sort().reverse();
    if(dates.length===0){
        tbody.innerHTML = '<tr><td colspan="4" class="text-tertiary">暂无记录</td></tr>';
        return;
    }
    tbody.innerHTML = dates.map(d=>{
        const s = state.stats[d];
        const rate = s.tested>0 ? Math.round(s.correct/s.tested*100)+'%' : '--';
        return `<tr><td>${d}</td><td>${s.tested}</td><td>${s.correct}</td><td>${rate}</td></tr>`;
    }).join('');
}

// ==================== 倒数日 ====================
let editingCdIndex = -1;

function addCountdown(){
    editingCdIndex = -1;
    document.getElementById('modal-countdown-title').textContent = '添加倒数日';
    document.getElementById('cd-name').value = '';
    document.getElementById('cd-date').value = '';
    document.getElementById('btn-cd-delete').style.display = 'none';
    document.getElementById('modal-countdown').classList.add('show');
}

function editCountdown(index){
    editingCdIndex = index;
    const cd = state.countdowns[index];
    document.getElementById('modal-countdown-title').textContent = '编辑倒数日';
    document.getElementById('cd-name').value = cd.name;
    document.getElementById('cd-date').value = cd.date;
    document.getElementById('btn-cd-delete').style.display = '';
    document.getElementById('modal-countdown').classList.add('show');
}

function saveCountdown(){
    const name = document.getElementById('cd-name').value.trim();
    const date = document.getElementById('cd-date').value;
    if(!name || !date) return;
    if(editingCdIndex >= 0){
        state.countdowns[editingCdIndex] = {name,date};
    } else {
        state.countdowns.push({name,date});
    }
    saveState();
    document.getElementById('modal-countdown').classList.remove('show');
    renderCountdowns();
}

function deleteCountdown(){
    if(editingCdIndex >= 0){
        state.countdowns.splice(editingCdIndex,1);
        saveState();
        document.getElementById('modal-countdown').classList.remove('show');
        renderCountdowns();
    }
}

// ==================== 每日重置 ====================
function checkDayReset(){
    const td = today();
    if(state.lastDate && state.lastDate !== td){
        const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
        const yd = yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
        if(state.lastDate === yd){
            state.streak++; // 连续
        } else {
            state.streak = 1; // 中断
        }
        state.lastDate = td;
        saveState();
    }
    if(!state.lastDate){
        state.lastDate = td;
        state.streak = 1;
        saveState();
    }
}

// ==================== 初始化 ====================
function init(){
    loadState();
    checkDayReset();

    // 底部导航
    document.querySelectorAll('.nav-btn').forEach(btn=>{
        btn.addEventListener('click',()=>navigate(btn.dataset.page));
    });

    // 主页按钮
    document.getElementById('btn-start-study').addEventListener('click',()=>{
        if(state.words.length===0){
            alert('请先导入单词');
            navigate('import');
            return;
        }
        if(state.index > 0 && state.index < state.order.length){
            document.getElementById('modal-start').classList.add('show');
        } else {
            startNormalStudy(false);
        }
    });

    document.getElementById('btn-continue').addEventListener('click',()=>{
        document.getElementById('modal-start').classList.remove('show');
        startNormalStudy(false);
    });

    document.getElementById('btn-restart').addEventListener('click',()=>{
        document.getElementById('modal-start').classList.remove('show');
        startNormalStudy(true);
    });

    document.getElementById('btn-wrong-review').addEventListener('click',()=>{
        const wrongs = Object.values(state.wrong);
        if(wrongs.length===0){
            alert('暂无错词');
            return;
        }
        startWrongReview();
    });

    // 学习页按钮
    document.getElementById('btn-study-back').addEventListener('click',()=>{
        navigate('home');
    });
    document.getElementById('btn-reveal').addEventListener('click',revealWord);
    document.getElementById('btn-correct').addEventListener('click',()=>answerWord(true));
    document.getElementById('btn-wrong').addEventListener('click',()=>answerWord(false));
    document.getElementById('btn-speak').addEventListener('click',()=>{
        const en = document.getElementById('word-en').textContent;
        if(en && en!=='完成！' && en!=='没有单词') speakWord(en);
    });

    // 错词本按钮
    document.getElementById('btn-wrong-review2').addEventListener('click',startWrongReview);

    // 倒数日
    document.getElementById('btn-add-countdown').addEventListener('click',addCountdown);
    document.getElementById('btn-cd-save').addEventListener('click',saveCountdown);
    document.getElementById('btn-cd-cancel').addEventListener('click',()=>{
        document.getElementById('modal-countdown').classList.remove('show');
    });
    document.getElementById('btn-cd-delete').addEventListener('click',deleteCountdown);

    // 导入
    let parsedWords = [];
    document.getElementById('btn-parse').addEventListener('click',()=>{
        const text = document.getElementById('import-text').value.trim();
        if(!text){alert('请粘贴文本');return;}
        parsedWords = parseWordText(text);
        if(parsedWords.length===0){
            alert('未识别到单词，请检查格式：每行"英文 中文"（空格分隔）');
            return;
        }
        document.getElementById('import-count').textContent = `识别到 ${parsedWords.length} 个单词`;
        document.getElementById('import-words').innerHTML = parsedWords.slice(0,50).map(w=>
            `<div class="word-row"><span class="w-en">${esc(w.en)}</span><span class="w-zh">${esc(w.zh)}</span></div>`
        ).join('') + (parsedWords.length>50 ? `<p class="text-tertiary mt-sm">……还有 ${parsedWords.length-50} 个</p>` : '');
        document.getElementById('import-preview').style.display = 'block';
        document.getElementById('btn-import-confirm').style.display = '';
    });

    document.getElementById('btn-load-demo').addEventListener('click',()=>{
        document.getElementById('import-text').value = BUILTIN_WORDS.map(w=>w.en+' '+w.zh).join('\n');
    });

    document.getElementById('btn-clear-preview').addEventListener('click',()=>{
        parsedWords = [];
        document.getElementById('import-preview').style.display = 'none';
        document.getElementById('btn-import-confirm').style.display = 'none';
    });

    document.getElementById('btn-import-confirm').addEventListener('click',()=>{
        if(parsedWords.length===0) return;
        state.words = parsedWords;
        state.order = shuffle(parsedWords.map((_,i)=>i));
        state.index = 0;
        saveState();
        syncRefChecked(); // 同步参考词库勾选
        document.getElementById('import-preview').style.display = 'none';
        document.getElementById('btn-import-confirm').style.display = 'none';
        document.getElementById('import-text').value = '';
        alert(`已导入 ${parsedWords.length} 个单词`);
        navigate('home');
    });

    // 点击弹窗遮罩关闭
    document.querySelectorAll('.modal-overlay').forEach(overlay=>{
        overlay.addEventListener('click',function(e){
            if(e.target===this) this.classList.remove('show');
        });
    });

    // 完成弹窗按钮
    document.getElementById('btn-complete-restart').addEventListener('click',()=>{
        document.getElementById('modal-complete').classList.remove('show');
        studyMode==='wrong-review' ? startWrongReview() : startNormalStudy(true);
    });
    document.getElementById('btn-complete-wrong').addEventListener('click',()=>{
        document.getElementById('modal-complete').classList.remove('show');
        if(Object.keys(state.wrong).length>0) startWrongReview();
        else navigate('home');
    });
    document.getElementById('btn-complete-home').addEventListener('click',()=>{
        document.getElementById('modal-complete').classList.remove('show');
        navigate('home');
    });

    // 参考词库
    loadRefWords();

    document.getElementById('btn-ref-import-toggle').addEventListener('click',()=>{
        const block = document.getElementById('ref-import-block');
        block.style.display = block.style.display==='none' ? 'block' : 'none';
    });

    let refParsedWords = [];
    document.getElementById('btn-ref-parse').addEventListener('click',()=>{
        const text = document.getElementById('ref-import-text').value.trim();
        if(!text){alert('请粘贴文本');return;}
        refParsedWords = parseWordText(text);
        if(refParsedWords.length===0){alert('未识别到单词');return;}
        // 追加到参考词库
        const existing = new Set(refWords.map(w=>w.en.toLowerCase()));
        let added = 0;
        for(const w of refParsedWords){
            if(!existing.has(w.en.toLowerCase())){
                refWords.push({en:w.en,zh:w.zh,inMain:false});
                existing.add(w.en.toLowerCase());
                added++;
            }
        }
        saveRefWords();
        syncRefChecked();
        renderRefPage();
        document.getElementById('ref-import-text').value = '';
        alert(`新增 ${added} 个，参考词库共 ${refWords.length} 个`);
    });

    document.getElementById('btn-ref-replace').addEventListener('click',()=>{
        const text = document.getElementById('ref-import-text').value.trim();
        if(!text){alert('请粘贴文本');return;}
        refParsedWords = parseWordText(text);
        if(refParsedWords.length===0){alert('未识别到单词');return;}
        if(!confirm('替换将清空现有参考词库，用新列表覆盖。确定？')) return;
        refWords = refParsedWords.map(w=>({en:w.en,zh:w.zh,inMain:false}));
        saveRefWords();
        syncRefChecked();
        renderRefPage();
        document.getElementById('ref-import-text').value = '';
        alert(`已替换，共 ${refWords.length} 个`);
    });

    document.getElementById('btn-ref-clear').addEventListener('click',()=>{
        if(!confirm('确定清空参考词库？')) return;
        refWords = [];
        saveRefWords();
        renderRefPage();
        document.getElementById('ref-import-text').value = '';
    });

    // 预加载语音
    if('speechSynthesis' in window){
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = ()=>window.speechSynthesis.getVoices();
    }

    // 初始渲染
    renderHome();
}

function startNormalStudy(reshuffle){
    studyMode = 'normal';
    if(reshuffle || state.order.length === 0){
        state.order = shuffle(state.words.map((_,i)=>i));
    }
    state.index = 0;
    state.roundResults = [];
    saveState();
    navigate('study');
}

function startWrongReview(){
    studyMode = 'wrong-review';
    state.index = 0;
    state.roundResults = [];
    saveState();
    navigate('study');
}

// ==================== Service Worker ====================
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister())).catch(()=>{});}
